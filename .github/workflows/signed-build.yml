name: Signed build

on:
  workflow_dispatch:

permissions:
  contents: read

# 不写 shell 时默认是 bash -e，没有 pipefail，管道左边失败会被吞掉。
defaults:
  run:
    shell: bash

concurrency:
  group: signed-build
  cancel-in-progress: false

env:
  # 证书指纹是公开信息。构建结果不是这把证书签的就失败。
  RELEASE_CERT_SHA256: 5c612fb62001fdee47abc453e5b774a35b49f9091146438a8c6aa38b4e003533

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 签名 secrets 只在这个 environment 里，它只允许 main。工作流文件能在分支上改，
    # 所以限制放在 GitHub 的 environment 设置里，不放在这里写 if。
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-build
      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.THETA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "THETA_RELEASE_KEYSTORE_BASE64 没有配置" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          THETA_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          THETA_RELEASE_STORE_PASSWORD: ${{ secrets.THETA_RELEASE_STORE_PASSWORD }}
          THETA_RELEASE_KEY_ALIAS: ${{ secrets.THETA_RELEASE_KEY_ALIAS }}
          THETA_RELEASE_KEY_PASSWORD: ${{ secrets.THETA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify the signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i "certificate SHA-256 digest: $RELEASE_CERT_SHA256"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theta-core-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
