name: PR Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-build
      # 单元测试、插件链接验证和设备测试在 InstaBox 执行，入口见 scripts/verify-s1.sh。
      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
